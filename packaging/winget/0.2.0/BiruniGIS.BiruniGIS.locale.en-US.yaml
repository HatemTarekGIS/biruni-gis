ShortDescription: Free desktop GIS with a modern ribbon interface, English and Arabic, based on QGIS.
Description: |-
  Biruni GIS is a free and open-source desktop GIS for surveyors, engineers, planners and students.
  It opens ArcGIS Pro projects and ArcMap documents, turns Excel and CAD drawings into GIS layers, downloads open data
  (OpenStreetMap, satellite imagery, elevation, land cover), checks data quality, makes print-ready
  map sheets and web maps, and keeps a version of the project on every save. Based on QGIS.
