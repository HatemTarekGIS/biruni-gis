; Biruni GIS defaults for the QGIS engine.
; These are *defaults*: anything the user changes is stored in their profile
; and wins. The launcher passes this file with --globalsettingsfile.

[qgis]
checkVersion=false
allowVersionCheck=false
monitorDirectoriesInBrowser=true

[app]
check-version=false
hide-splash=true
news-feed\items\httpsfeedqgisorg\disabled=true

[project]
proj-open-at-launch=0

[locale]
overrideFlag=true
userLocale=en_US

[digitizing]
default-snap-enabled=true
default-snap-type=VertexAndSegment
default-snapping-tolerance=12.0
default-snapping-tolerance-unit=Pixels

[PythonPlugins]
biruni=true
db_manager=false
processing_saga_nextgen=true

[connections]
xyz\items\OpenStreetMap\url=https://tile.openstreetmap.org/{z}/{x}/{y}.png
xyz\items\OpenStreetMap\zmax=19
xyz\items\OpenStreetMap\zmin=0
xyz\items\OpenTopoMap\url=https://tile.opentopomap.org/{z}/{x}/{y}.png
xyz\items\OpenTopoMap\zmax=17
xyz\items\OpenTopoMap\zmin=0
