<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Biruni GIS · isolation test</title>
<style>
body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;background:#0E1615;color:#E6EEED}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-size:19px;margin:6px 0}
.d{color:#9AABAE;font-size:13px}
button{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:10px;background:#0E7C74;color:#fff;font-size:15px;text-align:start}
button.s{background:#26403D}
iframe{width:100%;height:190px;border:1px solid #26403D;border-radius:10px;background:#0E1615}
textarea{width:100%;height:220px;background:#15201F;color:#cfe;border:1px solid #26403D;border-radius:8px;font:12px/1.4 ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<div class="w">
<h1>Isolation test · تجربة العزل</h1>
<div class="d">الصفحة دي على biruni-gis.com وما فيهاش أي سكربت من جوجل. التجربة: هل الإذن بيوصلها من الصفحة المعزولة؟</div>
<div class="d">A · جوه الإطار ده اضغط «Link Google Drive»:</div>
<iframe id="fr" src="https://drive.biruni-gis.com/spike/?embed=1"></iframe>
<button id="pop">B · Popup mode (نافذة منفصلة)</button>
<button id="cp" class="s">انسخ النتايج (Copy results)</button>
<textarea id="out" readonly></textarea>
</div>
<script>
const out=document.getElementById('out');
function log(s){out.value+=s+'\n'}
log('UA: '+navigator.userAgent);
log('google script on this page: '+(!!(window.google&&window.google.accounts)));
window.addEventListener('message',async e=>{
 if(e.origin!=='https://drive.biruni-gis.com')return;
 const m=e.data||{};
 if(m.type==='biruni-drive-ready'){log('helper ready');return}
 if(m.type==='biruni-drive-error'){log('helper FAIL: '+m.error);return}
 if(m.type!=='biruni-drive-token')return;
 log('token received from helper (exp in '+Math.round((m.exp-Date.now())/60000)+' min)');
 try{const r=await fetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)',{headers:{Authorization:'Bearer '+m.token}});
  log('Drive call from biruni-gis.com with that token: '+r.status+(r.ok?' OK':''))}catch(err){log('Drive call FAIL: '+err.message)}
});
document.getElementById('pop').onclick=()=>{const w=window.open('https://drive.biruni-gis.com/spike/?embed=1','biruniauth','width=480,height=640');log('popup opened: '+!!w)};
document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(out.value);log('(copied)')}catch(e){out.select();document.execCommand('copy');log('(copied, old way)')}};
</script>
</body>
</html>
