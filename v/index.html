.intro{text-align:center;padding:18px 6px 6px}

.val{font-weight:600;text-align:end;overflow-wrap:anywhere;min-width:0}

.drop.over{border-color:var(--accent);background:var(--soft)}

.hide{display:none!important}

<script>
/*CORE{*/
/* hashing, Ed25519 signature checking (RFC 8032) and the seal record, with no library */
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
function unb64(s){s=String(s).trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';
 const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o}
/* the SHA-2 constants are the fractions of square and cube roots of the first primes, computed exactly */
function iroot(n,k){const K=BigInt(k);let x=1n<<BigInt(Math.ceil(n.toString(2).length/k)+1);
 for(;;){const y=((K-1n)*x+n/x**(K-1n))/K;if(y>=x)return x;x=y}}
const PRIMES=[];for(let n=2;PRIMES.length<80;n++)if(PRIMES.every(p=>n%p))PRIMES.push(n);
const frac=(p,k,bits)=>iroot(BigInt(p)<<BigInt(bits*k),k)&((1n<<BigInt(bits))-1n);
const K256=Uint32Array.from(PRIMES.slice(0,64),p=>Number(frac(p,3,32))),H256=Uint32Array.from(PRIMES.slice(0,8),p=>Number(frac(p,2,32)));
const K512=PRIMES.map(p=>frac(p,3,64)),H512=PRIMES.slice(0,8).map(p=>frac(p,2,64));
class Sha256{
 constructor(){this.s=H256.slice();this.b=new Uint8Array(64);this.n=0;this.len=0;this.w=new Uint32Array(64)}
 update(d){let i=0;this.len+=d.length;
  if(this.n){i=Math.min(64-this.n,d.length);this.b.set(d.subarray(0,i),this.n);this.n+=i;if(this.n<64)return this;this.block(this.b,0);this.n=0}
  for(;i+64<=d.length;i+=64)this.block(d,i);
  if(i<d.length){this.b.set(d.subarray(i),0);this.n=d.length-i}return this}
 block(x,o){const w=this.w,S=this.s;
  for(let i=0;i<16;i++,o+=4)w[i]=x[o]<<24|x[o+1]<<16|x[o+2]<<8|x[o+3];
  for(let i=16;i<64;i++){const p=w[i-15],q=w[i-2];
   w[i]=w[i-16]+((p>>>7|p<<25)^(p>>>18|p<<14)^(p>>>3))+w[i-7]+((q>>>17|q<<15)^(q>>>19|q<<13)^(q>>>10))}
  let a=S[0],b=S[1],c=S[2],d=S[3],e=S[4],f=S[5],g=S[6],h=S[7];
  for(let i=0;i<64;i++){
   const t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K256[i]+w[i])|0;
   const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b)^(a&c)^(b&c)))|0;
   h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
  S[0]+=a;S[1]+=b;S[2]+=c;S[3]+=d;S[4]+=e;S[5]+=f;S[6]+=g;S[7]+=h}
 digest(){const L=this.len,r=L%64,pad=new Uint8Array((r<56?56-r:120-r)+8),v=new DataView(pad.buffer);
  pad[0]=0x80;v.setUint32(pad.length-8,Math.floor(L/0x20000000));v.setUint32(pad.length-4,(L*8)%0x100000000);this.update(pad);
  const o=new Uint8Array(32),ov=new DataView(o.buffer);this.s.forEach((x,i)=>ov.setUint32(4*i,x));return o}}
/* SHA-512 with BigInt: only for the few bytes of a signature check */
function sha512(m){const M=(1n<<64n)-1n,r=(x,n)=>(x>>n|x<<(64n-n))&M,L=m.length,p=new Uint8Array(Math.ceil((L+17)/128)*128);
 p.set(m);p[L]=0x80;let bits=BigInt(L)*8n;for(let i=p.length-1;bits>0n;i--,bits>>=8n)p[i]=Number(bits&255n);
 const S=H512.slice(),w=new Array(80);
 for(let o=0;o<p.length;o+=128){
  for(let i=0;i<16;i++){let v=0n;for(let j=0;j<8;j++)v=v<<8n|BigInt(p[o+8*i+j]);w[i]=v}
  for(let i=16;i<80;i++){const x=w[i-15],y=w[i-2];
   w[i]=(w[i-16]+(r(x,1n)^r(x,8n)^(x>>7n))+w[i-7]+(r(y,19n)^r(y,61n)^(y>>6n)))&M}
  let [a,b,c,d,e,f,g,h]=S;
  for(let i=0;i<80;i++){
   const t1=(h+(r(e,14n)^r(e,18n)^r(e,41n))+((e&f)^(~e&M&g))+K512[i]+w[i])&M;
   const t2=((r(a,28n)^r(a,34n)^r(a,39n))+((a&b)^(a&c)^(b&c)))&M;
   h=g;g=f;f=e;e=(d+t1)&M;d=c;c=b;b=a;a=(t1+t2)&M}
  [a,b,c,d,e,f,g,h].forEach((x,i)=>S[i]=(S[i]+x)&M)}

const P=2n**255n-19n,LQ=2n**252n+27742317777372353535851937790883648493n;
const md=a=>{a%=P;return a<0n?a+P:a};
function pw(b,e){let r=1n;b=md(b);while(e>0n){if(e&1n)r=r*b%P;b=b*b%P;e>>=1n}return r}
const inv=x=>pw(x,P-2n),DC=md(-121665n*inv(121666n)),SQRTM1=pw(2n,(P-1n)/4n);
function padd(p,q){const a=md((p[1]-p[0])*(q[1]-q[0])),b=md((p[1]+p[0])*(q[1]+q[0])),c=md(2n*p[3]*q[3]*DC),d=md(2n*p[2]*q[2]);
 const e=b-a,f=d-c,g=d+c,h=b+a;return [md(e*f),md(g*h),md(f*g),md(e*h)]}
function pmul(s,p){let q=[0n,1n,1n,0n];while(s>0n){if(s&1n)q=padd(q,p);p=padd(p,p);s>>=1n}return q}
function xrec(y,sign){if(y>=P)return null;const x2=md((y*y-1n)*inv(DC*y*y+1n));if(x2===0n)return sign?null:0n;
 let x=pw(x2,(P+3n)/8n);if(md(x*x-x2)!==0n)x=md(x*SQRTM1);if(md(x*x-x2)!==0n)return null;
 if(Number(x&1n)!==sign)x=P-x;return x}
const le=b=>{let v=0n;for(let i=b.length-1;i>=0;i--)v=v<<8n|BigInt(b[i]);return v};
function penc(p){const z=inv(p[2]),x=md(p[0]*z);let v=md(p[1]*z)|(x&1n)<<255n;const o=new Uint8Array(32);
 for(let i=0;i<32;i++,v>>=8n)o[i]=Number(v&255n);return o}
function pdec(b){if(b.length!==32)return null;let y=le(b);const s=Number(y>>255n);y&=(1n<<255n)-1n;
 const x=xrec(y,s);return x===null?null:[x,y,1n,md(x*y)]}
const GY=md(4n*inv(5n)),GX=xrec(GY,0),G=[GX,GY,1n,md(GX*GY)];
function edVerify(pub,sig,msg){if(pub.length!==32||sig.length!==64)return false;
 const A=pdec(pub),R=sig.subarray(0,32),s=le(sig.subarray(32));if(!A||s>=LQ||!pdec(R))return false;

 return got.every((v,i)=>v===R[i])}
/* the seal after the "#": version, time, size, start of the SHA-256, key, name, office, signature (seal/core.py) */
const MAGIC=new TextEncoder().encode('BIRUNI-SEAL');
function unpack(text){const b=unb64(text),dec=new TextDecoder('utf-8',{fatal:true});if(b[0]!==1)throw new Error('version');

 for(;;){const x=b[i++];if(x===undefined||mul>2**49)throw new Error('size');size+=(x&127)*mul;mul*=128;if(!(x&128))break}
 const head=b.slice(0,i),start=b.slice(i,i+8);i+=8;const pub=b.slice(i,i+32);i+=32;

 return {t,size,start:hex(start),pub,sig,name:dec.decode(name),office:dec.decode(office),
  message:h=>cat(MAGIC,head,h,pub,Uint8Array.of(nn),name,Uint8Array.of(no),office)}}
function fingerprint(pub){const h=hex(new Sha256().update(pub).digest()).slice(0,16).toUpperCase();return h.match(/.{4}/g).join(' ')}
