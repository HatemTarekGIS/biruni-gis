<style>
:root{--bg:#F4F6F8;--card:#FFFFFF;--text:#14181D;--dim:#5F6B76;--line:#E1E6EB;--accent:#12A594;--ink:#FFFFFF;
 --soft:#E1F4F1;--good:#12A36E;--fair:#C98A12;--poor:#D24B4B;--shadow:0 1px 2px rgba(16,24,32,.05),0 6px 20px rgba(16,24,32,.06)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

svg{width:1em;height:1em;flex:none}

.brand{display:flex;flex:none;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:18px}
.tools{display:flex;gap:8px;align-items:center;min-width:0}

.hero .pin{position:absolute;inset-inline-end:-8px;top:-8px;width:44px;height:44px;border-radius:50%;background:var(--accent);

.primary:active{transform:scale(.98)}.primary:disabled{opacity:.45}

.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--dim)}
.coords{display:block;font:600 21px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace;margin:6px 0 12px;
 font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden}

.acc{font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.good{color:var(--good)}.fair{color:var(--fair)}.poor{color:var(--poor)}
.meter i.good{background:var(--good)}.meter i.fair{background:var(--fair)}.meter i.poor{background:var(--poor)}
.sub{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.dir{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-variant-numeric:tabular-nums}
.dir svg{font-size:18px;color:var(--accent);transition:transform .35s}
.kinds{display:flex;gap:8px;overflow-x:auto;margin:10px -15px 12px;padding:0 15px;scrollbar-width:none}
.kinds::-webkit-scrollbar{display:none}
.kinds button{flex:none;font-size:15px;font-weight:600;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
 background:var(--bg);color:var(--text);transition:background .15s,color .15s,border-color .15s}
.kinds button.sel{background:var(--accent);border-color:var(--accent);color:var(--ink)}
input.in{width:100%;font:inherit;padding:12px 14px;border-radius:13px;border:1px solid var(--line);
 background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;min-height:48px}
input.in:focus{border-color:var(--accent)}
.fld{margin-bottom:14px}.fld .lbl{display:block;margin-bottom:7px}.fld .kinds{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.req{color:var(--poor);margin-inline-start:3px}
.fld.bad .lbl,.card.bad .lbl{color:var(--poor)}.fld.bad input.in,.card.bad input.in{border-color:var(--poor)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.grid div{position:relative;aspect-ratio:1;border-radius:15px;overflow:hidden;background:var(--line);animation:pop .35s ease-out}

.last{width:54px;height:54px;border-radius:15px;overflow:hidden;background:var(--line);justify-self:start}

.shutter:active .core{transform:scale(.9)}

.shutter:disabled .core{background:var(--line);color:var(--dim)}

.ghost{font-size:14px;font-weight:600;padding:8px 13px;border-radius:12px;border:1px solid var(--accent);

.sw{position:relative;flex:none;width:50px;height:30px}
.sw input{opacity:0;width:0;height:0;position:absolute}

.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(20px)}
[dir=rtl] .sw input:checked+span::after{transform:translateX(-20px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#gmap{display:block;width:100%;height:190px;margin:10px 0 8px;border-radius:14px;background:var(--bg)}
.gtext{font-size:17px;font-weight:700}
.gtext.in{color:var(--good)}.gtext.out{color:var(--fair)}
.coords.inroom{font:700 19px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;letter-spacing:0}

.rooms{max-height:40vh;overflow:auto}
.handInfo{font-size:13px;color:var(--dim);margin-top:8px}.handInfo:empty{display:none}
.handStep{font-size:16px;font-weight:600;line-height:1.45;padding:2px 12px 12px;text-align:center}

 BFP.tag(KEYB).then(t=>{DRV.tag=t;DRV.fold=dcache();driveSay(DRV.ok()&&!DRV.fold?'pick':DRV.state);drivePump()},()=>{});

/* ---- the upload: one photo at a time, as one .bfp file (drive.py) in biruni-photos-<tag>/p-<device>/ ----
   Once linked with the office folder chosen, Google Drive carries EVERY original, even with the line to the computer
   open; the line then sends only the small preview, at once (bridge.js sendItem). The line carries the original only
   when Drive cannot (driveFirst false: not linked, no folder, full, too big, or failing for DFALL since the line
   opened). DRV.HOLD says which way has an original ('drive' or 'line'), so it never goes both. The phone's own key (ECDSA P-256, not extractable), the numbering and the
   files' header bytes are kept in the database biruni-drive, so a retry uploads the very same bytes. */
const DMAX=5*1024*1024;   /* the phone keeps every photo under 5 MB (fitPhoto), so one plain upload carries it */
let DDB=null,DKEY=null,DBUSY=false;const DSKIP=new Set();
function ddb(){return DDB||(DDB=new Promise(r=>{try{const q=indexedDB.open('biruni-drive',1);
 q.onupgradeneeded=()=>q.result.createObjectStore('d',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);
 q.onblocked=()=>setTimeout(()=>r(null),4000)}catch(e){r(null)}}))}
async function dget(id){const d=await ddb();if(!d)return null;return new Promise(r=>{try{const g=d.transaction('d').objectStore('d').get(id);
 g.onsuccess=()=>r(g.result||null);g.onerror=()=>r(null)}catch(e){r(null)}})}
async function dput(rec){const d=await ddb();if(!d)return;return new Promise(r=>{try{const t=d.transaction('d','readwrite');
 t.objectStore('d').put(rec);t.oncomplete=()=>r();t.onerror=()=>r();t.onabort=()=>r()}catch(e){r()}})}
async function dkey(){if(DKEY)return DKEY;let k=await dget('#key');
 if(!k||!k.kp||!k.pub){const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);
  k={id:'#key',kp:kp,pub:b64u.enc(await crypto.subtle.exportKey('raw',kp.publicKey))};await dput(k)}
 return DKEY=k}
function dnext(){const n=(+kept('biruni-drive-n')||0)+1;keep('biruni-drive-n',String(n));return n}
async function dapi(path,opt){opt=opt||{};const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),opt.ms||60000);
 opt.headers=Object.assign({Authorization:'Bearer '+DRV.tok},opt.headers||{});opt.signal=ac.signal;
 try{return await fetch(DRV.API+path,opt)}finally{clearTimeout(tm)}}
class DriveStop extends Error{constructor(state){super(state);this.state=state}}
async function dcheck(r){if(r.ok)return r;if(r.status===401){driveDead();throw new DriveStop('auth')}
 let j=null;try{j=await r.clone().json()}catch(e){}
 const why=j&&j.error&&((j.error.errors||[])[0]||{}).reason||'';
 if(r.status===403&&/storageQuotaExceeded|quotaExceeded/.test(why)){driveSay('full');throw new DriveStop('full')}
 const e=new Error('drive '+r.status+' '+why);e.status=r.status;
 e.perm=r.status===403&&/insufficientFilePermissions|insufficientPermissions|forbidden|appNotAuthorizedToFile/.test(why);
 e.rate=r.status===403&&/rateLimitExceeded|userRateLimitExceeded/.test(why);e.ra=r.headers.get('Retry-After');throw e}
/* a failed try waits 2, 4, 8 ... 64 s (a little random, so many phones do not come back together); Google's
   Retry-After wins when longer (up to 10 minutes). Success, the network coming back, a new token or folder start over */
DRV.BACK=2000;DRV.fails=0;DRV.until=0;DRV.tm=0;
function ddelay(n,ra){let ms=Math.min(64000,DRV.BACK*Math.pow(2,Math.max(0,n-1)))+Math.floor(Math.random()*Math.min(1000,DRV.BACK/2));
 if(ra){let s=+ra;if(!isFinite(s)){const t=Date.parse(ra);s=isFinite(t)?(t-Date.now())/1000:0}
  if(s>0)ms=Math.max(ms,Math.min(600000,s*1000))}return ms}
function dlater(ms){clearTimeout(DRV.tm);   /* the wait is over: a pump still busy is waited for, the time is not lost */
 DRV.tm=setTimeout(()=>{DRV.tm=0;if(DBUSY){dlater(250);return}DRV.until=0;drivePump()},ms)}
function dsoon(){DRV.fails=0;DRV.until=0;clearTimeout(DRV.tm);DRV.tm=0}
const DFOLDER='application/vnd.google-apps.folder';
const dq=s=>"'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'";
async function dfind(q){const r=await dcheck(await dapi('/drive/v3/files?spaces=drive&orderBy=createdTime&pageSize=10'
 +'&supportsAllDrives=true&includeItemsFromAllDrives=true&fields='
 +encodeURIComponent('files(id,name,size,createdTime)')+'&q='+encodeURIComponent(q)));return (await r.json()).files||[]}
async function dmkdir(name,parent,props){const m={name:name,mimeType:DFOLDER,appProperties:props};if(parent)m.parents=[parent];
 const r=await dcheck(await dapi('/drive/v3/files?supportsAllDrives=true&fields=id',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify(m)}));return (await r.json()).id}
async function dfolder(name,parent,key,val){
 const q="name="+dq(name)+" and mimeType="+dq(DFOLDER)+" and trashed=false and appProperties has { key="+dq(key)
  +" and value="+dq(val)+" }"+(parent?" and "+dq(parent)+" in parents":"");
 let f=await dfind(q);if(f.length)return f[0].id;
 const mine=await dmkdir(name,parent,{[key]:val});f=await dfind(q);
 /* two phones made it at the same moment: keep the oldest (Drive for desktop would show the other as "(1)") */
 if(f.length&&f[0].id!==mine){try{await dapi('/drive/v3/files/'+mine,{method:'DELETE'})}catch(e){}return f[0].id}
 return mine}
/* the office's folder biruni-photos-<tag> is made by Biruni on the office computer and shared with the surveyor;
   the phone never makes it: it is chosen once in Google Picker (drivePicked), then kept per room */
async function dfolders(tag){const c=DRV.fold;if(c&&c.t===tag)return c;driveSay('pick');throw new DriveStop('pick')}
async function dverify(id){const r=await dapi('/drive/v3/files/'+encodeURIComponent(id)+'?supportsAllDrives=true&fields='
 +encodeURIComponent('id,name,mimeType,trashed,ownedByMe,capabilities(canAddChildren)'));
 if(r.status===404)return 'ok';   /* the write that follows is the real test */
 await dcheck(r);const j=await r.json();
 if(j.name!==DRV.fname()||j.mimeType!==DFOLDER||j.trashed){const e=new Error('not the folder');e.status=404;throw e}
 if(j.capabilities&&j.capabilities.canAddChildren===false)return 'ro';return j.ownedByMe?'own':'ok'}
/* Drive takes uploads into a folder in the bin without a word, and Drive for desktop never shows them: look at the
   office folder again every 5 minutes; in the bin, deleted or no longer shared, it is gone (the line takes the
   originals until it is chosen again) */
const DCHECK=300000;
async function dfresh(){const c=DRV.fold,ck='biruni-drive-f-'+ROOM;if(!c||Date.now()-(+c.v||0)<DCHECK)return;
 let v;try{v=await dverify(c.r)}catch(e){if(e instanceof DriveStop)throw e;
  if(e.status===403||e.status===404||e.perm){keep(ck,null);DRV.fold=null;driveSay('gone');throw new DriveStop('gone')}
  throw e}
 if(v==='ro'){keep(ck,null);DRV.fold=null;driveSay('ro');throw new DriveStop('ro')}
 c.v=Date.now();keep(ck,JSON.stringify(c))}
async function dlost(){const c=DRV.fold,ck='biruni-drive-f-'+ROOM;if(!c)throw new DriveStop('pick');
 try{const v=await dverify(c.r);if(v==='ro'){const e=new Error('ro');e.perm=true;e.ro=true;throw e}
  if(typeof DRIVE_ON!=='undefined'&&DRIVE_ON)c.p=await dfolder('p-'+DEVID,c.r,'biruniDev',DEVID);
  if(typeof GDRIVE!=='undefined'&&GDRIVE)c.g=await dfolder('g-'+DEVID,c.r,'biruniGps',DEVID);
  keep(ck,JSON.stringify(c))}
 catch(e){if(e instanceof DriveStop)throw e;
  if(e.status===403||e.status===404||e.perm){keep(ck,null);DRV.fold=null;driveSay(e.ro?'ro':'gone');throw new DriveStop('gone')}
  throw e}}
const DFALL=120000;   /* Drive failing this long while the line is open: the line takes the originals */
function dfits(it){return !!(typeof DRIVE_ON!=='undefined'&&DRIVE_ON&&it&&it.meta&&it.meta.sealed&&!it.carried
 &&it.blob&&it.blob.size<=DMAX&&!DSKIP.has(it.id))}
function deligible(it){return dfits(it)&&!DRV.HOLD.has(it.id)}
function driveFirst(it){return DRV.on&&DRV.go()&&!(DRV.bad&&(DRV.bad===1||Date.now()-DRV.bad>DFALL))&&dfits(it)}
async function dstill(id){return (await all()).some(x=>x.id===id)}
async function dupload(it){const tag=await BFP.tag(KEYB),k=await dkey();let rec=await dget(it.id);
 if(rec&&rec.room===tag&&rec.st==='done')return rec;   /* sent before; only leaving the queue was missed */
 if(!rec||rec.room!==tag||!rec.head){const body=new Uint8Array(await it.blob.arrayBuffer()),n=dnext();
  const h={room:tag,dev:DEVID,kid:await BFP.kid(it.pk||PCKEY),id:it.id,n:n,t:+it.meta.t||Date.now(),pub:k.pub,
   cert:await BFP.cert(KEYB,SURVKEY,k.pub,DEVID)};
  const f=await BFP.pack(h,body,k.kp.privateKey);
  rec={id:it.id,room:tag,n:n,name:f.name,head:f.head,size:f.bytes.length,fsha:await BFP.sha(f.bytes),st:'q',tries:0,at:Date.now()};
  await dput(rec)}
 const fo=await dfolders(tag);await dfresh();let j;
 try{
  if(rec.tries>0){   /* the last try may have arrived without its answer: look before sending again */
   const got=await dfind("appProperties has { key='bfp' and value="+dq(it.id)+" } and "+dq(fo.p)+" in parents and trashed=false");
   const g=got.find(g=>+g.size===rec.size);if(g){rec.fid=g.id;return rec}}
  rec.tries++;await dput(rec);
  const b='bfp'+rid().replace(/[^A-Za-z0-9]/g,''),meta={name:rec.name,parents:[fo.p],appProperties:{bfp:it.id}};
  const body=new Blob(['--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b
   +'\r\nContent-Type: application/octet-stream\r\n\r\n',rec.head,it.blob,'\r\n--'+b+'--\r\n']);
  let r;try{r=await dapi('/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields='
   +encodeURIComponent('id,size,sha256Checksum'),
   {method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:body,ms:180000})}
  catch(e){throw new Error('network')}
  await dcheck(r);j=await r.json()}
 catch(e){if(e.status===404||e.perm)await dlost();   /* the share was taken back (stops), or only p-<device> went */
  throw e}
 if(+j.size!==rec.size||(j.sha256Checksum&&j.sha256Checksum!==rec.fsha)){
  try{await dapi('/drive/v3/files/'+encodeURIComponent(j.id)+'?supportsAllDrives=true',{method:'DELETE'})}catch(e){}
  throw new Error('drive copy differs')}
 rec.fid=j.id;return rec}
async function drivePump(){if(!DRV.on)return;
 if(DBUSY){DRV.again=true;return}   /* asked while busy (a new token, folder or photo): runs again right after */
 DBUSY=true;   /* before any await: never two pumps at once */
 try{try{const w=(await all()).filter(dfits).length;if(w!==DRV.w){DRV.w=w;if(DRV.state==='auth'){driveSay('auth');driveHello()}}}
  catch(e){}
  if(DRV.tok&&!DRV.ok()){driveDead();return}   /* the hour ended: say so, the line takes the originals meanwhile */
  if(Date.now()<DRV.until||!DRV.go())return;
  const items=(await all()).filter(deligible).sort((a,b)=>a.meta.t-b.meta.t);
  for(const it of items){if(!DRV.go())break;
   if(DRV.HOLD.has(it.id)||!await dstill(it.id))continue;   /* the line took it meanwhile */
   DRV.HOLD.set(it.id,'drive');driveSay('up');
   try{const rec=await dupload(it),fresh=rec.st!=='done';rec.st='done';rec.head=null;rec.at=Date.now();await dput(rec);
    await del(it.id);if(fresh){DRV.n++;keep('biruni-drive-c-'+ROOM,String(DRV.n))}DRV.bad=0;DRV.fails=0;DRV.until=0;mark(it.id,'✓');count();
    clearTimeout(DRV.rt);DRV.rt=setTimeout(dreceipts,60000);   /* by then the PC has it from Drive for desktop */
    driveSay('idle')}
   catch(e){if(e instanceof DriveStop){if(e.state==='full')DRV.bad=1;break}
    if(e.status===400||e.status===413){DSKIP.add(it.id)}   /* Drive will never take it: it stays for the bridge */
    else{if(!DRV.bad)DRV.bad=Date.now();DRV.fails++;const ms=ddelay(DRV.fails,e.ra);DRV.until=Date.now()+ms;dlater(ms)}
    driveSay('wait');break}
   finally{DRV.HOLD.delete(it.id)}}}
 catch(e){}finally{DBUSY=false;if(DRV.again){DRV.again=false;setTimeout(drivePump,50)}}}

/* ---- freeing the surveyor's Drive (step 10). The files are the surveyor's (drive.file), so only this phone can delete
   them, and only those the PC says it holds as full originals: a receipt over the line, signed with the PC's identity
   key (no pin, no receipts). The office chooses: keep (the default), manual (a button here) or auto (at once). A file
   goes to the surveyor's bin (Hatem's choice: it can still be restored; Drive empties the bin after 30 days). The small
   record of it goes 30 days later */
async function dall(){const d=await ddb();if(!d)return [];return new Promise(r=>{try{const g=d.transaction('d').objectStore('d').getAll();
 g.onsuccess=()=>r((g.result||[]).filter(x=>x&&x.id&&x.id[0]!=='#'));g.onerror=()=>r([])}catch(e){r([])}})}
async function dgall(){const d=await ddb();if(!d)return [];return new Promise(r=>{try{const g=d.transaction('d').objectStore('d').getAll();
 g.onsuccess=()=>r((g.result||[]).filter(x=>x&&x.id&&x.id.startsWith('#g')));g.onerror=()=>r([])}catch(e){r([])}})}
async function ddrop(id){const d=await ddb();if(!d)return;return new Promise(r=>{try{const t=d.transaction('d','readwrite');
 t.objectStore('d').delete(id);t.oncomplete=()=>r();t.onerror=()=>r();t.onabort=()=>r()}catch(e){r()}})}
async function dreceipts(){if(!DRV.on||typeof lineOpen!=='function'||!lineOpen()||!ID.pin)return;
 const now=Date.now(),a=await dall();
 for(const r of a)if(r.st==='freed'&&now-(+r.at||0)>2592000000)await ddrop(r.id);
 const ids=a.filter(r=>r.st==='done'&&r.fid).map(r=>r.id).slice(0,100);
 if(!ids.length){dshowFree();return}
 const nonce=rid();DRV.rq={nonce:nonce,ids:new Set(ids)};
 try{lineText(JSON.stringify({t:'dhave',nonce:nonce,ids:ids}))}catch(e){}}
async function driveGot(m){const q=DRV.rq;if(!q||!ID.pin||!m||m.nonce!==q.nonce||!Array.isArray(m.ids))return;
 const cl=String(m.clean||''),ids=m.ids.map(String);
 if(!['auto','manual','keep'].includes(cl)||!await IDOK(m.ip,m.is,'BRDG1|'+m.nonce+'|'+cl+'|'+ids.join(','))){
  SIG.refused=(SIG.refused||0)+1;return}
 DRV.rq=null;DRV.clean=cl;keep('biruni-drive-clean-'+ROOM,cl);
 for(const id of ids){if(!q.ids.has(id))continue;const r=await dget(id);if(r&&r.st==='done'){r.st='got';await dput(r)}}
 await dshowFree();if(cl==='auto')dfree();
 else if(q.ids.size>=100&&ids.length)setTimeout(dreceipts,2000)}   /* more than one batch waits */
async function dshowFree(){const c=DRV.card;if(!c)return;const n=(await dall()).filter(r=>r.st==='got').length;DRV.free=n;
 const b=c.querySelector('.dfree');b.textContent=String(T.driveFree||'').replace('{n}',n);
 b.classList.toggle('hide',!(n>0&&DRV.clean==='manual'&&DRV.ok()))}
var DFREEING=false;   /* var: driveSay may look at it before this line has run */
async function dfree(){if(DFREEING||!DRV.ok())return;DFREEING=true;
 try{for(const r of await dall()){if(r.st!=='got'||!r.fid)continue;let res;
   try{res=await dapi('/drive/v3/files/'+encodeURIComponent(r.fid)+'?supportsAllDrives=true&fields=id',
    {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}catch(e){break}
   if(res.status===204||res.status===200||res.status===404){r.st='freed';r.at=Date.now();await dput(r)}
   else if(res.status===401){driveDead();break}
   else if(res.status===403)continue;   /* not ours to delete (the office took it over): left there */
   else break}}
 finally{DFREEING=false;await dshowFree();driveSay(DRV.state)}}

/* ---- Biruni fallback ladder: store-and-forward positions + channel race ---- */
const LAD=(()=>{
 const CH=[
  {id:'direct',minGap:900,ready:()=>typeof lineOpen==='function'&&lineOpen(),
   send:s=>{lineText(JSON.stringify({t:'lp',s:s}));return true},okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'tunnel',minGap:1000,ready:()=>SIG.relays.some(r=>r.kind==='tunnel'),
   send:s=>{const r=SIG.relays.find(x=>x.kind==='tunnel');return r?r.post(s):false},
   okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'own',minGap:2000,ready:()=>(SIG.kinds().own||0)>0,
   send:s=>SIG.sendRaw(s,'own'),okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'mqtt',minGap:2000,ready:()=>(SIG.kinds().mqtt||0)>0,
   send:s=>SIG.sendRaw(s,'mqtt'),okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'nostr',minGap:3000,ready:()=>(SIG.kinds().nostr||0)>0,
   send:s=>SIG.sendRaw(s,'nostr'),okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'ntfy',minGap:2000,ready:()=>(SIG.kinds().ntfy||0)>0,
   send:s=>SIG.sendRaw(s,'ntfy'),okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0},
  {id:'drive',minGap:20000,
   ready:()=>typeof GDRIVE!=='undefined'&&GDRIVE&&typeof DRV==='object'&&DRV.go(),
   send:()=>false,okAt:0,fails:0,unacked:0,waitMs:0,until:0,lastSent:0}
 ];
 const pad=n=>String(n).padStart(9,'0');
 const keyFor=q=>ROOM+':'+pad(q);
 function openPosDb(){return new Promise(r=>{
  if(typeof indexedDB==='undefined')return r(null);
  try{const q=indexedDB.open('biruni-pos',1);
   q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('p'))q.result.createObjectStore('p')};
   q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
 const lad={
  epoch:'',seq:0,upto:0,cap:false,db:null,_items:[],_pushes:0,_waitSince:0,_lastProbe:0,_ticking:false,
  _timer:null,_ready:null,_resolveReady:null,_startedAt:0,_lastDriveClean:0,_driveBusy:false,_cleaning:false,
  init(){
   if(this._ready)return this._ready;
   this._startedAt=Date.now();
   let e=kept('biruni-lad-e-'+ROOM);if(!e){e=rid();keep('biruni-lad-e-'+ROOM,e)}this.epoch=e;
   this.seq=parseInt(kept('biruni-lad-q-'+ROOM)||'0',10)||0;
   this.upto=parseInt(kept('biruni-lad-u-'+ROOM)||'0',10)||0;
   if(typeof TUNH==='string'&&/^[a-z0-9-]{3,80}$/.test(TUNH)){this.cap=true;SIG.tunnel(TUNH)}
   if(typeof GDRIVE!=='undefined'&&GDRIVE)this.cap=true;
   this._ready=(async()=>{
    this.db=await openPosDb();
    if(this.db){try{
     const r=IDBKeyRange.bound(ROOM+':',ROOM+':\uffff');
     const all=await this._tx('readonly',s=>s.getAll(r))||[];
     this._items=all.filter(x=>x&&typeof x.q==='number').sort((a,b)=>a.q-b.q);
     if(this._items.length){const mx=this._items[this._items.length-1].q;
      if(mx>this.seq){this.seq=mx;keep('biruni-lad-q-'+ROOM,String(this.seq))}}
    }catch(ex){}}
    this.drawPill();
   })();
   if(!this._timer)this._timer=setInterval(()=>this.tick(),1000);
   return this._ready;
  },
  _tx(mode,fn){return new Promise((res,rej)=>{
   if(!this.db)return res(null);
   try{const t=this.db.transaction('p',mode),q=fn(t.objectStore('p'));
    t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}catch(e){rej(e)}})},
  onCap(m){if(m&&m.lad)this.cap=true;if(m&&m.tun)this.onTun(m.tun)},
  onTun(h){if(typeof h==='string'&&/^[a-z0-9-]{3,80}$/.test(h)){
   keep('biruni-tun-'+ROOM,h);this.cap=true;SIG.tunnel(h)}},
  get backlog(){return this._items.length},
  primary(now=Date.now()){return CH.find(c=>c.ready()&&c.okAt>0&&(now-c.okAt)<=10000)||null},
  viaName(){const p=this.primary();if(!p||p.id==='direct')return '';
   if(p.id==='tunnel')return T.chTunnel||'direct address';
   if(p.id==='own')return T.chOwn||'Biruni relay';
   if(p.id==='drive')return T.driveTitle||'Google Drive';
   return T.chRelay||'public relay'},
  statusText(){return !!this.viaName()},
  drawPill(){const wp=$('waitPill');if(!wp)return;const n=this._items.length;
   if(!n){if(GPSMODE)wp.classList.add('hide');return}
   const stalled=!!(this._waitSince&&(Date.now()-this._waitSince)>=3000);
   const active=lineOpen()||(!!this.primary()&&!stalled);
   const tpl=active?(T.ladCatch||'Sending {n} earlier positions…'):
    (T.ladKeep||'{n} positions kept on the phone - they are sent when the computer is in reach.');

   Two phones on one Wi-Fi or hotspot (no internet needed) link directly after showing each other a QR code each.
   Every photo is sealed for the computer (ECDH P-256 + AES-GCM to its key): the teammate carries it and cannot open
   it; whichever phone reaches the computer first delivers it, and the computer keeps one copy. */
const H64={enc:b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
 dec:s=>{s=String(s||'');return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4)),c=>c.charCodeAt(0))}};
const hcat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};
const sleepH=ms=>new Promise(r=>setTimeout(r,ms));
async function sealFor(pub,bytes){const pk=await crypto.subtle.importKey('raw',H64.dec(pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
 const eph=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'ECDH',public:pk},eph.privateKey,256);
 const key=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',bits),'AES-GCM',false,['encrypt']);
 const iv=crypto.getRandomValues(new Uint8Array(12)),raw=new Uint8Array(await crypto.subtle.exportKey('raw',eph.publicKey));
 return hcat(new Uint8Array([1]),raw,iv,new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes)))}
async function sealItem(it){if(it.meta&&it.meta.sealed)return it.blob;   /* already sealed for the PC: kept as it is */

 new DataView(n.buffer).setUint32(0,m.length);return new Blob([await sealFor(PCKEY,hcat(n,m,img))],{type:'application/octet-stream'})}
/* the link's offer and answer, short enough for a QR code: only what a direct link on one network needs */
function sdpCode(sdp,kind){const g=r=>(sdp.match(r)||[])[1]||'',fp=g(/a=fingerprint:sha-256 ([0-9A-Fa-f:]+)/);

function codeSdp(code){const p=String(code||'').split('|');if(p.length!==5||!/^B1[oa]$/.test(p[0])||!p[1]||!p[2])return null;

 const offer=p[0]==='B1o';
 let s='v=0\r\no=- 1 2 IN IP4 127.0.0.1\r\ns=-\r\nt=0 0\r\na=group:BUNDLE 0\r\nm=application 9 UDP/DTLS/SCTP webrtc-datachannel\r\n'+
  'c=IN IP4 0.0.0.0\r\na=ice-ufrag:'+p[1]+'\r\na=ice-pwd:'+p[2]+'\r\na=fingerprint:sha-256 '+fp+'\r\na=setup:'+(offer?'actpass':'active')+
  '\r\na=mid:0\r\na=sctp-port:5000\r\na=max-message-size:262144\r\n';
 (p[4]?p[4].split(','):[]).forEach((c,i)=>{const j=c.lastIndexOf('_');if(j>0)s+='a=candidate:'+(i+1)+' 1 udp '+(2122260223-i)+' '+
  c.slice(0,j)+' '+c.slice(j+1)+' typ host generation 0\r\n'});
 return {type:offer?'offer':'answer',sdp:s+'a=end-of-candidates\r\n'}}

const QRM=(()=>{

 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=((z<<1)^((z>>>7)*0x11D))&255;z^=((y>>>i)&1)*x}return z};
 function rsDiv(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;
  for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
 function rsRem(data,div){const r=new Array(div.length).fill(0);
  for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r}
 function align(v){if(v===1)return [];const n=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(n*2-2))*2,out=[6];
  for(let p=v*4+10;out.length<n;p-=step)out.splice(1,0,p);return out}
 const MASK=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
  (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
 function penalty(m,n){let p=0;
  for(let a=0;a<2;a++)for(let i=0;i<n;i++){let run=1;for(let j=1;j<=n;j++){
   const same=j<n&&(a?m[j][i]===m[j-1][i]:m[i][j]===m[i][j-1]);if(same)run++;else{if(run>=5)p+=run-2;run=1}}}
  for(let y=0;y<n-1;y++)for(let x=0;x<n-1;x++){const c=m[y][x];if(c===m[y][x+1]&&c===m[y+1][x]&&c===m[y+1][x+1])p+=3}
  let dark=0;m.forEach(r=>r.forEach(c=>{dark+=c?1:0}));return p+Math.max(0,Math.ceil(Math.abs(dark*20-n*n*10)/(n*n))-1)*10}

  for(;v<=20;v++)if(4+(v<10?8:16)+bytes.length*8<=dataCw(v)*8)break;
  if(v>20)throw new Error('too long for a code');
  const bits=[],put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  const nb=BLK[v],ec=ECC[v],rawCw=Math.floor(raw(v)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb),div=rsDiv(ec),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ec+(i<nShort?0:1));k+=dat.length;const e=rsRem(dat,div);
   if(i<nShort)dat.push(0);blocks.push(dat.concat(e))}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ec||j>=nShort)cw.push(b[i])});
  const n=v*4+17,m=[...Array(n)].map(()=>new Array(n).fill(false)),fn=[...Array(n)].map(()=>new Array(n).fill(false));
  const set=(x,y,d)=>{m[y][x]=d;fn[y][x]=true};
  for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;
   if(xx>=0&&xx<n&&yy>=0&&yy<n)set(xx,yy,d!==2&&d!==4)}};
  finder(3,3);finder(n-4,3);finder(3,n-4);
  const al=align(v),last=al.length-1;
  al.forEach((a,i)=>al.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===last)||(i===last&&j===0))return;
   for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}));
  const format=mask=>{const d=mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);
   const f=((d<<10)|r)^0x5412,g=i=>((f>>>i)&1)===1;
   for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
   for(let i=0;i<8;i++)set(n-1-i,8,g(i));for(let i=8;i<15;i++)set(8,n-15+i,g(i));set(8,n-8,true)};
  format(0);
  if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const f=(v<<12)|r;
   for(let i=0;i<18;i++){const d=((f>>>i)&1)===1,a=n-11+i%3,c=Math.floor(i/3);set(a,c,d);set(c,a,d)}}
  let i=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;
   for(let vert=0;vert<n;vert++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)===0?n-1-vert:vert;
    if(!fn[y][x]&&i<cw.length*8){m[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
  const apply=k=>{for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!fn[y][x]&&MASK[k](x,y))m[y][x]=!m[y][x]};
  let best=force;
  if(best==null){let low=Infinity;for(let k=0;k<8;k++){apply(k);format(k);const p=penalty(m,n);if(p<low){low=p;best=k}apply(k)}}
  apply(best);format(best);return m}})();

function drawQr(c,text){const m=QRM(text),n=m.length,q=4,s=Math.max(2,Math.floor(640/(n+2*q)));

 m.forEach((r,y)=>r.forEach((d,x)=>{if(d)g.fillRect((x+q)*s,(y+q)*s,s,s)}))}

 try{ok=await h.onRead(String(text||''))}catch(e){}h.reading=false;
 if(ok){h.onRead=null;clearInterval(h.timer);$('handScan').classList.add('hide')}

function handShow(code){window._handCode=code;const c=$('handQr');drawQr(c,code);c.classList.remove('hide')}
function handClose(){const h=HAND;HAND=null;if(!h)return;clearInterval(h.timer);clearTimeout(h.deadline);

function handGathered(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,2500);

async function handGive(){if(HAND)return;const items=await all();

 await h.pc.setLocalDescription(await h.pc.createOffer());await handGathered(h.pc);if(HAND!==h)return;

async function handSend(h,ch){const items=(await all()).filter(it=>it.meta&&(it.meta.sealed||PCKEY));

   ch.send(JSON.stringify({t:'item',id:it.id,at:it.meta.t||Date.now(),size:buf.length}));

async function handTake(){if(HAND)return;const h=HAND={role:'take',n:0};handOpen();handText(T.handWait);
 if(!await handCamera()){handClose();toast(T.handNoScan);return}
 if(HAND!==h)return;handText(T.handTake1);

 ch.onclose=()=>{if(HAND===h&&!h.done){h.done=true;handClose();toast(h.n?T.handTook.replace('{n}',h.n):T.handFail);count()}}}

async function flush(){if(busy)return;busy=true;

   rOnly=typeof relayOnly==='function'&&relayOnly(),items=rOnly?allItems.filter(x=>!x.prevSent&&!x.carried):allItems;
  let tried=0;for(const it of items){
   const st=await sendItem(it);
   if(!st)continue;   /* 0: another way (Google Drive) is sending this one */
   tried++;
   if(st===200){await del(it.id);sent++;arrived++;mark(it.id,'✓')}
   else if(st===202){if(await prevDone(it.id))mark(it.id,'◐')}
   else if(st===403){await del(it.id);mark(it.id,'✗');status(false,'blocked')}
   else if(st===400||st===413){await del(it.id);mark(it.id,'✗')}
   else throw new Error(st);count()}
  const ok=tried?true:await alive();
  if(ok&&!rOnly)status(true,'connected');else if(!ok)offline()}catch(e){offline()}
