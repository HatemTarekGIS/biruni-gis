name = "biruni-relay"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

routes = [
  { pattern = "relay.biruni-gis.com", custom_domain = true }
]

[[durable_objects.bindings]]
name = "HUB"
class_name = "HubDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HubDO"]

[vars]
ROOM_PER_HOUR = "600"
DAY_BUDGET = "1600000"
