<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Biruni Portal</title><style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font)}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:14px 16px 16px}
.top{display:flex;gap:12px;align-items:center;max-width:1180px;margin:auto}
.logo{width:44px;height:44px;flex:none;display:block}
.top h1{margin:0;font-size:20px;unicode-bidi:plaintext}.top p{margin:2px 0 0;opacity:.9;font-size:13px;unicode-bidi:plaintext}
.grow{flex:1;min-width:0}
.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:#e3f6ee;color:var(--ok)}.b-bad{background:#fde7e7;color:var(--bad)}.b-warn{background:#fff3dc;color:var(--warn)}
.b-gold{background:var(--gold);color:#3b2a00}.b-mute{background:rgba(127,140,138,.15);color:var(--mute)}
header .badge{margin-top:8px}
.bar{max-width:1180px;margin:12px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=search],.bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bar input[type=search]{flex:1;min-width:180px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff}button.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.follows{max-width:1180px;margin:10px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px}
main{max-width:1180px;margin:12px auto 40px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--teal2)}.card.untrusted{border-color:var(--bad);background:repeating-linear-gradient(135deg,transparent 0 12px,rgba(198,40,40,.05) 12px 24px)}
.card h3{margin:0;font-size:15.5px;unicode-bidi:plaintext;overflow-wrap:anywhere}.card .meta{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px;background:var(--line)}
.tag{background:rgba(20,163,148,.12);color:var(--teal2);border-radius:6px;padding:0 6px;font-size:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg.hide{display:none}.box{background:var(--card);color:var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.box h2{margin:0 0 6px;font-size:18px;unicode-bidi:plaintext}.box dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.box dt{color:var(--mute)}.box dd{margin:0;overflow-wrap:anywhere;unicode-bidi:plaintext}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.note{font-size:13px;color:var(--mute);margin:8px 0}.err{color:var(--bad);font-size:13.5px;margin-top:8px}
.box input[type=password],.box input[type=file]{font:inherit;width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.banner{max-width:1180px;margin:10px auto 0;padding:10px 14px;border-radius:12px;background:#fff3dc;color:#6b4400;font-size:13.5px}
.banner.hide{display:none}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
</style></head>

 catch(e){if(gen===GEN){S.portals=[{ok:false,why:'unreachable',items:[],idx:null,base:base}];render()}return}
 const main=await check(doc,Q.get('k'),base,null),list=[main];
 if(main.idx)for(const f of main.idx.follows||[]){let fb=baseOf(f.url);if(!/^[a-z]+:/i.test(fb)&&!fb.startsWith('/'))fb=base+fb;
  try{list.push(await check(await fetchDoc(fb+'portal.json'),f.pub,fb,f))}catch(e){list.push({follow:f,ok:false,why:'unreachable',items:[],idx:null,base:fb})}}
 if(gen!==GEN)return;S.portals=list;render()}
/* ---- the member key */
function keyFromStore(){try{const t=sessionStorage.getItem('biruni-portal-me')||localStorage.getItem('biruni-portal-me');if(t){const d=JSON.parse(t);S.me={name:d.name,box:d.box,priv:HEX.dec(d.priv)}}}catch(e){}}
async function useKey(text,pass,remember){const d=JSON.parse(text);if(d.kind!=='biruni-portal-key')throw new Error('kind');let priv;
 if(d.priv)priv=HEX.dec(d.priv);else{if(!pass)throw new Error('pass');priv=await unseal(await pbkdf2(pass,B64.dec(d.kdf.salt),d.kdf.it),B64.dec(d.ct),'biruni-portal-key')}
 if(HEX.enc(xpub(priv))!==d.box)throw new Error('mismatch');S.me={name:d.name||'',box:d.box,priv:priv};
 const s=JSON.stringify({name:S.me.name,box:S.me.box,priv:HEX.enc(priv)});try{sessionStorage.setItem('biruni-portal-me',s);if(remember)localStorage.setItem('biruni-portal-me',s)}catch(e){}
 render();return S.me.box}
function forgetKey(){S.me=null;try{sessionStorage.removeItem('biruni-portal-me');localStorage.removeItem('biruni-portal-me')}catch(e){}render()}
/* ---- opening items */
async function getBlob(it){const m=it.m,url=it.P.base+m.file.path;let u=null;
 try{const r=await fetch(url,{cache:'no-store'});if(r.ok)u=new Uint8Array(await r.arrayBuffer())}catch(e){}
 if(!u)u=await pickFile();if((await sha256(u))!==m.file.sha256)throw new Error(T('altered'));return u}
function pickFile(){return new Promise((res,rej)=>{const box=$('itemBox'),p=document.createElement('p');p.className='note';p.textContent=T('pick');
 const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return rej(new Error('none'));res(new Uint8Array(await f.arrayBuffer()))};box.appendChild(p);box.appendChild(i)})}
async function openBytes(it){if(!it.ok)throw new Error(T('untrustedMsg'));if(it.expired)throw new Error(T('expiredMsg'));
 if(!it.m.file)throw new Error('not a file');if(!it.m.file.enc)return await getBlob(it);
 if(!S.me)throw new Error(T('notMember'));const idx=it.P.idx;
 for(const g of idx.groups||[]){const w=(it.e.keys||{})[g.id];if(!w)continue;const mem=(g.members||[]).find(x=>x.box===S.me.box);if(!mem)continue;
  const eph=B64.dec(mem.env.e),k=await hkdf(await x25519(S.me.priv,eph),join(eph,HEX.dec(S.me.box)),'biruni-portal-group');
  const gk=await unseal(k,B64.dec(mem.env.c),'group:'+idx.id+':'+g.id+':'+g.ver);
  const cek=await unseal(gk,B64.dec(w.w),'cek:'+it.m.id+':'+g.id+':'+w.v);
  return await unseal(cek,await getBlob(it),'item:'+it.m.id)}
 throw new Error(T('notMember'))}
function save(bytes,name,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:mime||'application/octet-stream'}));a.download=name||'file';
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function resolve(it,url){if(/^[a-z][a-z0-9+.-]*:/i.test(url)){return /^(https?|mailto):/i.test(url)?url:null}return it.P.base+url}
/* ---- display */
const memberOf=(P,g)=>!!(S.me&&(g.members||[]).some(x=>x.box===S.me.box));
function allItems(){const out=[],fol=$('fFollow').checked;for(const P of S.portals){if(P.follow&&!fol)continue;for(const it of P.items)out.push(it)}return out}
function groupName(P,id){const g=(P.idx&&P.idx.groups||[]).find(x=>x.id===id);return g?g.name:id}
function left(exp){const s=exp-Date.now()/1000;return s>86400?Math.round(s/86400)+' '+T('days'):Math.max(1,Math.round(s/3600))+' '+T('hours')}
function badge(text,cls){const b=document.createElement('span');b.className='badge '+cls;b.textContent=text;return b}
function opt(sel,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)}
function fillFilters(){const items=allItems(),ty=$('fType'),tg=$('fTag'),gr=$('fGroup'),keep=[ty.value,tg.value,gr.value];
 ty.textContent='';opt(ty,'',T('allTypes'));for(const k of ['file','dashboard','mapservice','link'])if(items.some(i=>i.m.type===k))opt(ty,k,T('t_'+k));
 tg.textContent='';opt(tg,'',T('allTags'));for(const t of [...new Set(items.flatMap(i=>i.m.tags||[]))].sort())opt(tg,t,t);
 gr.textContent='';opt(gr,'',T('allGroups'));opt(gr,'@public',T('public'));if(S.me)opt(gr,'@mine',T('myGroups'));
 for(const P of S.portals)for(const g of (P.idx&&P.idx.groups)||[])opt(gr,(P.idx.id)+':'+g.id,g.name+(P.follow?' — '+(P.idx.name||''):''));
 [ty.value,tg.value,gr.value]=keep;for(const s of [ty,tg,gr])if(s.selectedIndex<0)s.value=''}
function matches(it){const q=$('q').value.trim().toLowerCase(),ty=$('fType').value,tg=$('fTag').value,gr=$('fGroup').value,m=it.m;
 if(ty&&m.type!==ty)return false;if(tg&&!(m.tags||[]).includes(tg))return false;
 if(gr==='@public'&&(m.groups||[]).length)return false;
 if(gr==='@mine'&&!(m.groups||[]).some(g=>{const G=(it.P.idx.groups||[]).find(x=>x.id===g);return G&&memberOf(it.P,G)}))return false;
 if(gr&&gr[0]!=='@'&&!(gr.split(':')[0]===it.P.idx.id&&(m.groups||[]).includes(gr.split(':')[1])))return false;
 if(q){const hay=[m.title,m.desc,m.scope,(m.tags||[]).join(' '),m.file&&m.file.name,it.P.idx&&it.P.idx.name].join(' ').toLowerCase();if(!hay.includes(q))return false}
 return true}
function render(){const main=S.portals[0];if(!main)return;const idx=main.idx;
 $('pName').textContent=idx?idx.name:T('title');$('pAbout').textContent=idx?(idx.about||''):'';
 const pb=$('pBadge');pb.className='badge '+(main.ok?'b-ok':main.why==='insecure'?'b-warn':'b-bad');
 pb.textContent=main.ok?('✓ '+T('signed')+' '+(idx.owner.name||'…')+' — '+T('print')+' '+main.print+(main.pinned?' · '+T('pinnedOk'):'')):
  main.why==='not the pinned key'?('✗ '+(idx.owner.name||'')+' '+T('pinnedBad')):main.why==='insecure'?T('insecure'):('✗ '+T(main.why==='unreachable'?'why_unreachable':'bad'));
 const bn=$('banner');const warn=main.rollback?T('rollback'):(main.why==='insecure'?T('insecure'):'');bn.textContent=warn;bn.classList.toggle('hide',!warn);
 $('keyBtn').textContent=S.me?('🔑 '+(S.me.name||T('keyOn'))):('🔑 '+T('myKey'));
 const fl=$('follows');fl.textContent='';const fols=S.portals.filter(P=>P.follow);if(fols.length){const s=document.createElement('b');s.textContent=T('follow')+':';s.className='note';fl.appendChild(s)}
 for(const P of fols){fl.appendChild(badge((P.idx?P.idx.name:P.follow.name||P.follow.url)+' — '+(P.ok?T('fOk'):(P.why==='unreachable'?T('unreachable'):T('fBad')+' ('+T('why_'+P.why)+')')),P.ok?'b-ok':'b-bad'))}
 fillFilters();const g=$('grid');g.textContent='';const list=allItems().filter(matches);
 if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent=T('noItems');g.appendChild(e)}
 for(const it of list){const m=it.m,c=document.createElement('div');c.className='card'+(it.ok?'':' untrusted');c.tabIndex=0;c.dataset.id=m.id;
  if(m.thumb&&it.ok){const im=document.createElement('img');im.alt='';im.loading='lazy';im.src=it.P.base+m.thumb;c.appendChild(im)}
  const h=document.createElement('h3');h.textContent=m.title||m.id;c.appendChild(h);
  const mt=document.createElement('div');mt.className='meta';mt.appendChild(badge(T('t_'+m.type),'b-mute'));
  if((m.groups||[]).length)mt.appendChild(badge('🔒 '+T('locked'),'b-gold'));if(!it.ok)mt.appendChild(badge('⚠ '+T('untrusted'),'b-bad'));
  if(it.expired)mt.appendChild(badge(T('expired'),'b-bad'));else if(m.expires)mt.appendChild(badge(T('expires')+' '+left(m.expires),'b-warn'));
  if(it.P.follow)mt.appendChild(badge('↗ '+(it.P.idx.name||''),'b-mute'));c.appendChild(mt);
  if((m.tags||[]).length){const t=document.createElement('div');t.className='meta';for(const x of m.tags){const s=document.createElement('span');s.className='tag';s.textContent=x;t.appendChild(s)}c.appendChild(t)}
  c.onclick=()=>showItem(it);c.onkeydown=e=>{if(e.key==='Enter')showItem(it)};g.appendChild(c)}}
function showItem(it){const m=it.m,box=$('itemBox');box.textContent='';const h=document.createElement('h2');h.textContent=m.title||m.id;box.appendChild(h);
 const mt=document.createElement('div');mt.className='meta';mt.appendChild(badge(it.ok?('✓ '+T('signed')+' '+(it.P.idx.owner.name||'')):('⚠ '+T('untrusted')+' — '+T('why_'+it.why)),it.ok?'b-ok':'b-bad'));box.appendChild(mt);
 if(m.desc){const p=document.createElement('p');p.textContent=m.desc;p.style.unicodeBidi='plaintext';box.appendChild(p)}
 const dl=document.createElement('dl');const row=(k,v)=>{if(v==null||v==='')return;const dt=document.createElement('dt');dt.textContent=T(k);const dd=document.createElement('dd');dd.textContent=v;dl.appendChild(dt);dl.appendChild(dd)};
 row('scope',m.scope);row('tags',(m.tags||[]).join('، '));row('groups',(m.groups||[]).map(g=>groupName(it.P,g)).join('، ')||T('public'));
 row('created',new Date(m.created*1000).toLocaleString(L==='ar'?'ar-EG':'en-GB'));if(m.expires)row(it.expired?'expired':'expires',new Date(m.expires*1000).toLocaleString(L==='ar'?'ar-EG':'en-GB'));
 if(m.file){row('file',m.file.name);row('size',(m.file.size/1024).toFixed(1)+' KB');row('hash',m.file.sha256)}if(m.url)row('address',m.url);if(it.P.follow)row('from',it.P.idx.name);
 box.appendChild(dl);const err=document.createElement('div');err.className='err';const acts=document.createElement('div');acts.className='row';
 const blocked=!it.ok?T('untrustedMsg'):it.expired?T('expiredMsg'):'';if(blocked)err.textContent=blocked;
 const go=async(b,fn)=>{err.textContent='';const t=b.textContent;b.disabled=true;b.textContent=T('working');try{await fn();b.textContent=T('done')}catch(e){err.textContent=e&&e.message||String(e);b.textContent=t}b.disabled=false};
 if(m.url&&!m.file){const b=document.createElement('button');b.className='pri';b.textContent=T('open');b.disabled=!!blocked;b.onclick=()=>{const u=resolve(it,m.url);if(u)window.open(u,'_blank','noopener')};acts.appendChild(b)}
 if(m.file){const enc=m.file.enc,b=document.createElement('button');b.className='pri';b.textContent=enc&&!S.me?T('unlock'):(m.file.mime==='text/uri-list'?T('open'):T('download'));b.disabled=!!blocked;
  b.onclick=()=>{if(enc&&!S.me){showKey();return}go(b,async()=>{const u=await openBytes(it);
   if(m.file.mime==='text/uri-list'){const url=resolve(it,new TextDecoder().decode(u).trim());if(url)window.open(url,'_blank','noopener')}else save(u,m.file.name,m.file.mime)})};acts.appendChild(b)}
 const c=document.createElement('button');c.textContent=T('close');c.onclick=()=>$('itemDlg').classList.add('hide');acts.appendChild(c);box.appendChild(acts);box.appendChild(err);
 $('itemDlg').classList.remove('hide')}
function showKey(){$('kErr').textContent='';$('kPass').value='';$('keyDlg').classList.remove('hide')}
function wire(){$('q').placeholder=T('search');$('fFollowL').textContent=T('follow');$('kTitle').textContent=T('kTitle');$('kNote').textContent=T('kNote');$('kPass').placeholder=T('kPass');
 $('kRememberL').textContent=T('kRemember');$('kOk').textContent=T('ok');$('kForget').textContent=T('forget');$('kCancel').textContent=T('cancel');
 for(const id of ['q','fType','fTag','fGroup','fFollow'])$(id).addEventListener(id==='q'?'input':'change',render);
 $('keyBtn').onclick=showKey;$('kCancel').onclick=()=>$('keyDlg').classList.add('hide');$('kForget').onclick=()=>{forgetKey();$('keyDlg').classList.add('hide')};
 $('kOk').onclick=async()=>{const f=$('kFile').files[0];if(!f)return;try{await useKey(await f.text(),$('kPass').value,$('kRemember').checked);$('keyDlg').classList.add('hide')}catch(e){$('kErr').textContent=T('kBad')}};
 for(const d of ['itemDlg','keyDlg'])$(d).addEventListener('click',e=>{if(e.target.id===d)$(d).classList.add('hide')});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')for(const d of ['itemDlg','keyDlg'])$(d).classList.add('hide')})}
wire();keyFromStore();S.ready=load();
window.BiruniPortal={state:S,ready:()=>S.ready,useKey:useKey,forgetKey:forgetKey,xmul:xmul,xpub:xpub,
 item:id=>{for(const P of S.portals)for(const it of P.items)if(it.m.id===id)return it;return null},
 openHash:async id=>{const it=window.BiruniPortal.item(id);return await sha256(await openBytes(it))},
 reload:()=>{S.ready=load();return S.ready}};
})();
</script>
